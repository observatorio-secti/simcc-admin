services:
  db:
    image: pgvector/pgvector:pg17
    volumes:
      - pgdata:/var/lib/postgresql/
    environment:
      POSTGRES_USER: db_user
      POSTGRES_DB: db
      POSTGRES_PASSWORD: db_password
    ports:
      - "${PORT_DB:-5432}:5432"

  app:
    image: app
    entrypoint: ./entrypoint.sh
    build: .
    ports:
      - "${APP_DB:-8000}:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://db_user:db_password@db:5432/db

volumes:
  pgdata:
