[project]
name = "simcc-admin"
version = "0.1.0"
description = ""
authors = [
    {name = "meirelesgc",email = "geu_costa@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.142.2,<0.143.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "httpx (>=0.28.1,<1.0.0)",
]

[tool.poetry]
packages = [{include = "simcc_admin", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "typos (>=1.50.3,<2.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "freezegun (>=1.5.5,<2.0.0)"
]


[tool.pytest.ini_options]
pythonpath = "."
addopts = "-s -x -vv --cov=simcc_admin --cov-context=test"

[tool.poe] 
poetry_command = ""

[tool.poe.tasks]
lint = { cmd = "ruff check" }
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
serve = "fastapi dev src/simcc_admin/app.py"
test.sequence = [
  "lint",
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]